<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <g fill="none" stroke="#0E493E" stroke-width="0.75" opacity="0.065">
    <!-- Center 8-point star -->
    <polygon points="50.00,25.00 54.40,39.38 67.68,32.32 60.62,45.60 75.00,50.00 60.62,54.40 67.68,67.68 54.40,60.62 50.00,75.00 45.60,60.62 32.32,67.68 39.38,54.40 25.00,50.00 39.38,45.60 32.32,32.32 45.60,39.38" />
    <!-- Center subtle rosette ring -->
    <circle cx="50" cy="50" r="16" stroke-dasharray="2,3" stroke-width="0.5" opacity="0.6" />
    <circle cx="50" cy="50" r="5" fill="#0E493E" fill-opacity="0.03" stroke="none" />

    <!-- 4 Corners (forming complete 8-point stars when tiled) -->
    <polygon points="0.00,-25.00 4.40,-10.62 17.68,-17.68 10.62,-4.40 25.00,0.00 10.62,4.40 17.68,17.68 4.40,10.62 0.00,25.00 -4.40,10.62 -17.68,17.68 -10.62,4.40 -25.00,0.00 -10.62,-4.40 -17.68,-17.68 -4.40,-10.62" />
    <polygon points="100.00,-25.00 104.40,-10.62 117.68,-17.68 110.62,-4.40 125.00,0.00 110.62,4.40 117.68,17.68 104.40,10.62 100.00,25.00 95.60,10.62 82.32,17.68 89.38,4.40 75.00,0.00 89.38,-4.40 82.32,-17.68 95.60,-10.62" />
    <polygon points="0.00,75.00 4.40,89.38 17.68,82.32 10.62,95.60 25.00,100.00 10.62,104.40 17.68,117.68 4.40,110.62 0.00,125.00 -4.40,110.62 -17.68,117.68 -10.62,104.40 -25.00,100.00 -10.62,95.60 -17.68,82.32 -4.40,89.38" />
    <polygon points="100.00,75.00 104.40,89.38 117.68,82.32 110.62,95.60 125.00,100.00 110.62,104.40 117.68,117.68 104.40,110.62 100.00,125.00 95.60,110.62 82.32,117.68 89.38,104.40 75.00,100.00 89.38,95.60 82.32,82.32 95.60,89.38" />

    <!-- Connecting Strapwork (Girih interlacing lines between stars) -->
    <!-- Horizontal & Vertical Connectors -->
    <line x1="50" y1="25" x2="50" y2="0" stroke-width="0.6" />
    <line x1="50" y1="75" x2="50" y2="100" stroke-width="0.6" />
    <line x1="25" y1="50" x2="0" y2="50" stroke-width="0.6" />
    <line x1="75" y1="50" x2="100" y2="50" stroke-width="0.6" />

    <!-- Diamond stars at mid-edges (50,0), (0,50), (100,50), (50,100) -->
    <polygon points="50,-8 56,0 50,8 44,0" stroke-width="0.6" />
    <polygon points="50,92 56,100 50,108 44,100" stroke-width="0.6" />
    <polygon points="-8,50 0,56 8,50 0,44" stroke-width="0.6" />
    <polygon points="92,50 100,56 108,50 100,44" stroke-width="0.6" />

    <!-- Diagonal interlace paths -->
    <line x1="32" y1="32" x2="18" y2="18" stroke-width="0.6" />
    <line x1="68" y1="32" x2="82" y2="18" stroke-width="0.6" />
    <line x1="32" y1="68" x2="18" y2="82" stroke-width="0.6" />
    <line x1="68" y1="68" x2="82" y2="82" stroke-width="0.6" />
    
    <!-- Fine corner center dot -->
    <circle cx="0" cy="0" r="3" fill="#0E493E" fill-opacity="0.03" stroke="none" />
    <circle cx="100" cy="0" r="3" fill="#0E493E" fill-opacity="0.03" stroke="none" />
    <circle cx="0" cy="100" r="3" fill="#0E493E" fill-opacity="0.03" stroke="none" />
    <circle cx="100" cy="100" r="3" fill="#0E493E" fill-opacity="0.03" stroke="none" />
  </g>
</svg>